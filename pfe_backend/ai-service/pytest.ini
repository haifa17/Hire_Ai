[pytest]
# `python -m pytest` (no args) runs the fast unit/integration suite only —
# tests/evaluation/ holds DeepEval-based LLM quality evaluations, which make
# real calls to the configured AI provider and are comparatively slow/costly.
# Run them explicitly with: pytest tests/evaluation/
addopts = --ignore=tests/evaluation
testpaths = tests
markers =
    evaluation: DeepEval LLM-quality evaluation (requires a configured AI provider; skipped unless run explicitly)
